services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: choice_fatigue
      POSTGRES_USER: choice_fatigue
      POSTGRES_PASSWORD: choice_fatigue_dev
    ports:
      - "5432:5432"
    volumes:
      - choice_fatigue_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choice_fatigue -d choice_fatigue"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  choice_fatigue_postgres:
