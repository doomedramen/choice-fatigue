min_version: 2.1.0

pre-commit:
  parallel: false
  commands:
    checks:
      run: git diff --cached --check && pnpm test && pnpm typecheck
      fail_text: "Commit blocked: fix the whitespace, unit test, or typecheck failures above."

pre-push:
  commands:
    pre-push-checks:
      run: bash scripts/pre-push-checks.sh
      fail_text: "Push blocked: fix the local checks above."
