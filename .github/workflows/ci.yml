name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: choice_fatigue
          POSTGRES_USER: choice_fatigue
          POSTGRES_PASSWORD: choice_fatigue_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U choice_fatigue -d choice_fatigue"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://choice_fatigue:choice_fatigue_ci@127.0.0.1:5432/choice_fatigue?schema=public
      BETTER_AUTH_SECRET: choice-fatigue-ci-auth-secret-long-enough-for-tests
      BETTER_AUTH_URL: http://127.0.0.1:4173
      INTEGRATION_CREDENTIALS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      E2E_DATABASE_URL: postgresql://choice_fatigue:choice_fatigue_ci@127.0.0.1:5432/choice_fatigue?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec prisma validate
      - run: pnpm build
      - run: pnpm db:deploy
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
